name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why baselines are being refreshed
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update visual snapshots
        env:
          CI: true
        run: npx playwright test --project=visual --update-snapshots=all

      - name: Commit baselines on a new branch
        id: commit
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if git diff --quiet -- tests/visual; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under tests/visual."
            exit 0
          fi

          source_branch="${GITHUB_REF_NAME}"
          new_branch="visual-baselines/${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$new_branch"
          git add tests/visual
          git commit -m "Visual baselines: ${REASON}"
          git push origin "$new_branch"

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${source_branch}...${new_branch}?expand=1"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "compare_url=${compare_url}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: steps.commit.outputs.changed == 'true'
        env:
          COMPARE_URL: ${{ steps.commit.outputs.compare_url }}
        run: |
          {
            echo "## Visual baseline update"
            echo ""
            echo "Open a pull request from the compare view:"
            echo ""
            echo "${COMPARE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
