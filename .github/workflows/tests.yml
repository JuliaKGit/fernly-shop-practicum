name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Cypress result paths
        run: mkdir -p web/cypress/results

      - name: Cypress component tests
        run: >-
          npm run cy:component --
          --reporter junit
          --reporter-options "mochaFile=cypress/results/component-[hash].xml"

      - name: Start shop and wait for Vite
        run: |
          nohup npm run start:web > vite.log 2>&1 &
          npx wait-on http://localhost:5173

      - name: Cypress UI tests
        run: >-
          npm run cy:ui --
          --reporter junit
          --reporter-options "mochaFile=cypress/results/ui-[hash].xml"

      - name: Upload Cypress screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cypress-results
          path: web/cypress/results
          if-no-files-found: ignore

  playwright:
    runs-on: ubuntu-latest
    env:
      FERNLY_USER_EMAIL: ava@fernly.test
      FERNLY_USER_PASSWORD: Fernly-Ava-2026
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test:pw

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            reports
          if-no-files-found: ignore

      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: a11y-report
          retention-days: 30

  report:
    needs: [cypress, playwright]
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: qa-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BASE_REF: ${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/download-artifact@v6
        with:
          name: playwright-report
          path: .

      - uses: actions/download-artifact@v6
        with:
          name: cypress-results
          path: web/cypress/results

      - uses: actions/download-artifact@v6
        with:
          name: a11y-report
          path: a11y-report
          if-no-files-found: ignore

      - name: Fetch base branch for findings diff
        run: git fetch --no-tags origin "${BASE_REF}"

      - name: Build QA report
        run: node scripts/qa-report.mjs build

      - name: Publish QA report
        run: node scripts/qa-report.mjs publish

      - name: Upload QA report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: qa-report
          path: qa-report
          retention-days: 90
